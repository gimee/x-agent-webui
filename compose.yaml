name: ${COMPOSE_PROJECT_NAME:-x-agent-webui}

services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    # No registry image: Compose builds X-Agent-Webui from this source tree.
    ports:
      - target: 6060
        published: "${X_AGENT_PORT:-6060}"
        host_ip: "${X_AGENT_BIND:-127.0.0.1}"
        protocol: tcp
    environment:
      PORT: "6060"
      BIND_HOST: "0.0.0.0"
      AUTH_DISABLED: "0"
      HOME: /home/agent
      HERMES_HOME: /home/agent/.hermes
      HERMES_WEB_UI_HOME: /home/agent/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: /home/agent/.hermes-web-ui
      CLAUDE_CONFIG_DIR: /home/agent/.claude
      HERMES_ALLOW_ROOT_GATEWAY: "1"
    volumes:
      - hermes:/home/agent/.hermes
      - webui:/home/agent/.hermes-web-ui
      - claude:/home/agent/.claude
      - pi:/home/agent/.pi
    restart: unless-stopped
    # The retained PID1 supervisor allows 30 seconds for graceful child shutdown.
    stop_grace_period: 45s
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5

volumes:
  hermes:
  webui:
  claude:
  pi:
